<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460" role="img" aria-labelledby="title desc">
  <title id="title">WebUpgradePro Logo Symbol</title>
  <desc id="desc">Metallic silver W with a blue upward growth arrow, on a transparent background.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#f1f3f7"/>
      <stop offset="0.58" stop-color="#cbd1dc"/>
      <stop offset="0.82" stop-color="#9aa4b4"/>
      <stop offset="1" stop-color="#6f7a8b"/>
    </linearGradient>
    <linearGradient id="silverEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c7ced8"/>
      <stop offset="1" stop-color="#4c5668"/>
    </linearGradient>
    <linearGradient id="blue" x1="0.6" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#18d8ef"/>
      <stop offset="0.33" stop-color="#00aef3"/>
      <stop offset="0.67" stop-color="#075ce9"/>
      <stop offset="1" stop-color="#1738b8"/>
    </linearGradient>
    <linearGradient id="blueEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecffff"/>
      <stop offset="0.28" stop-color="#24e1f5"/>
      <stop offset="0.72" stop-color="#0066ef"/>
      <stop offset="1" stop-color="#10208f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#020817" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(18 10)" filter="url(#shadow)">
    <!-- Main W -->
    <path d="M72 91
             L194 91
             L304 270
             L375 170
             L485 326
             L607 147
             L637 171
             L478 410
             L451 410
             L374 296
             L295 410
             L272 410
             Z"
          fill="url(#silver)"
          stroke="#30394a"
          stroke-width="4"
          stroke-linejoin="miter"/>

    <!-- Metallic highlight rim -->
    <path d="M74 93
             L193 93
             L304 274
             L375 174
             L485 330
             L607 151"
          fill="none"
          stroke="url(#silverEdge)"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95"/>

    <!-- Upward arrow -->
    <path d="M446 242
             L485 299
             L606 124
             L638 150
             L662 0
             L486 80
             L542 97
             Z"
          fill="url(#blue)"
          stroke="url(#blueEdge)"
          stroke-width="4"
          stroke-linejoin="miter"
          filter="url(#softGlow)"/>

    <!-- Arrow top highlight -->
    <path d="M488 80 L662 0 L638 150 L606 124"
          fill="none"
          stroke="#dfffff"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95"/>
  </g>
</svg>
